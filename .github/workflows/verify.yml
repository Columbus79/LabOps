name: Verify LabOps

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: labops
          POSTGRES_USER: labops
          POSTGRES_PASSWORD: test-only-ci-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops -d labops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: lab-agent/backend
    env:
      DATABASE_URL: postgresql+psycopg://labops:test-only-ci-secret@127.0.0.1:5432/labops
      JWT_SECRET_KEY: test-only-ci-jwt-secret-long-enough-for-tests
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab-agent/backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
      - name: PostgreSQL migration and concurrent business checks
        run: python -m app.scripts.postgres_acceptance

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-agent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab-agent/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
